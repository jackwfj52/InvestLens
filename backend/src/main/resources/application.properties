spring.application.name=backend

# IDE and Maven run on the host; containers use their service names in G37.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:investlens}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${MYSQL_USER:investlens}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=true
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:16379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.connect-timeout=250ms
spring.data.redis.timeout=250ms
spring.data.redis.repositories.enabled=false

# Redis is optional; durable readiness requires MySQL, not the cache.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Fallback container errors must not expose exception/configuration details.
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-path=never
spring.mvc.log-request-details=false

# Business threshold uses return observations (31 prices for the default 30 samples).
investlens.quant.minimum-return-samples=${INVESTLENS_QUANT_MINIMUM_RETURN_SAMPLES:30}
investlens.market.sina.cache-seconds=${INVESTLENS_SINA_CACHE_SECONDS:0}
investlens.market.sina.calls-per-minute=${INVESTLENS_SINA_CALLS_PER_MINUTE:60}
investlens.llm.calls-per-minute=${INVESTLENS_LLM_CALLS_PER_MINUTE:30}
